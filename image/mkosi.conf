# Speck OS root filesystem. mkosi builds the tree (Ubuntu packages, then mkosi.postinst.chroot runs
# the same install steps as provision/provision.sh); image/build.sh turns it into a USB installer
# image with image/speck-install. Run through image/build.sh, which supplies a pinned mkosi.

[Distribution]
Distribution=ubuntu
Release=noble
Architecture=x86-64
Repositories=main,universe,restricted,multiverse

[Output]
ImageId=speck-os
Format=tar
CompressOutput=zstd
OutputDirectory=out

[Build]
# The postinst fetches Node, Chrome, llama.cpp and the voice models.
WithNetwork=yes
# This repo (with dist/speck-src.tar.gz) at /work/src/speck-os for the postinst script.
BuildSources=..:speck-os
CacheDirectory=cache
Environment=LLAMA_BACKEND=vulkan LLAMA_REF=master LLAMA_PORTABLE=1 BAKE_MODELS=0

[Content]
# GRUB goes on at install time (speck-install), where the disk layout is known.
Bootable=no
WithDocs=no
Hostname=speck
Locale=C.UTF-8
Timezone=UTC
Packages=
        # boot: Ubuntu's HWE kernel (newer GPUs and Wi-Fi), signed shim + GRUB for Secure Boot
        linux-generic-hwe-24.04
        linux-firmware
        amd64-microcode
        intel-microcode
        initramfs-tools
        grub-efi-amd64
        grub-efi-amd64-signed
        shim-signed
        efibootmgr
        mokutil
        # system
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        apt
        ubuntu-keyring
        tzdata
        kmod
        util-linux
        less
        nano
        # disks: btrfs layout, snapshots, the installer
        btrfs-progs
        snapper
        dosfstools
        e2fsprogs
        gdisk
        parted
        rsync
        zstd
        # network: NetworkManager owns every interface; setup and the agent drive it with nmcli
        network-manager
        network-manager-config-connectivity-ubuntu
        netplan.io
        wpasupplicant
        iw
        wireless-regdb
        # screen and sound
        cage
        pipewire
        pipewire-pulse
        wireplumber
        alsa-ucm-conf
        firmware-sof-signed
        fonts-noto-core
        fonts-noto-color-emoji
        mesa-vulkan-drivers
        vulkan-tools
        # building llama.cpp backends and native npm modules (speck-hwd builds CUDA on the box)
        build-essential
        cmake
        pkg-config
        git
        python3
        python3-venv
        libcurl4-openssl-dev
        libssl-dev
        libsecret-1-dev
        libvulkan-dev
        glslc
        spirv-headers
        # tools the broker and scripts use
        ca-certificates
        curl
        gnupg
        jq
        psmisc
        pciutils
        bzip2
